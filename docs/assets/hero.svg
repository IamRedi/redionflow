<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">RediOnFlow</title>
  <desc id="d">Eine Codebasis, zwei Produkte: BaumdienstFlow für Baumpflege und BauFlow für Bau- und Tiefbaubetriebe.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1f17"/>
      <stop offset="1" stop-color="#1b1712"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f9e66"/>
      <stop offset="1" stop-color="#1f7a4d"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e8590c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <text x="80" y="118" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" letter-spacing="4" fill="#8fd3ae">EINE CODEBASIS · ZWEI PRODUKTE</text>
  <text x="80" y="196" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#ffffff">Redi<tspan fill="#ff8a3d">On</tspan>Flow</text>
  <text x="80" y="246" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#d7dcd8">Betriebssoftware für Teams, die draußen arbeiten:</text>
  <text x="80" y="280" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#d7dcd8">Baustellen, Tagesplan, Stunden, Fuhrpark, Kalkulation.</text>
  <text x="80" y="340" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#9aa39d">Next.js · TypeScript · PostgreSQL · 6 Sprachen · Live-Demo</text>

  <g transform="translate(820 92)">
    <rect width="380" height="96" rx="18" fill="#132a1e" stroke="#2f9e66" stroke-opacity="0.6"/>
    <rect x="20" y="24" width="48" height="48" rx="12" fill="url(#green)"/>
    <path d="M44 34c-8 6-12 12-12 18a12 12 0 0 0 24 0c0-6-4-12-12-18zm0 22v10" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="88" y="48" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">BaumdienstFlow</text>
    <text x="88" y="74" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#a8d8bd">Baumpflege · Kataster · Fällungen</text>
  </g>
  <g transform="translate(820 212)">
    <rect width="380" height="96" rx="18" fill="#2a1a10" stroke="#ff8a3d" stroke-opacity="0.6"/>
    <rect x="20" y="24" width="48" height="48" rx="12" fill="url(#orange)"/>
    <path d="M32 62h24M36 62V46l8-8 8 8v16M42 62v-8h4v8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="48" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">BauFlow</text>
    <text x="88" y="74" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#f3c6a5">Bau · Tiefbau · Glasfaser</text>
  </g>
</svg>
