<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid meet"><style>
.sa-spin{transform-box:fill-box;transform-origin:center;animation:sa-spin 1.1s linear infinite}
.sa-bob{animation:sa-bob 2.6s ease-in-out infinite}
.sa-swing{transform-box:fill-box;transform-origin:50% 0;animation:sa-swing 3.4s ease-in-out infinite}
.sa-spark{animation:sa-spark .5s steps(2,end) infinite}
.sa-spark2{animation:sa-spark .5s steps(2,end) .25s infinite}
.sa-glow{animation:sa-glow 1.3s ease-in-out infinite}
.sa-dash{stroke-dasharray:5 4;animation:sa-dash 1.4s linear infinite}
.sa-paint{transform-box:fill-box;transform-origin:0 50%;animation:sa-paint 2.8s ease-in-out infinite alternate}
.sa-roll{animation:sa-roll 2.8s ease-in-out infinite alternate}
.sa-drill{animation:sa-drill 1.8s ease-in-out infinite}
.sa-dip{animation:sa-dip 3.6s ease-in-out infinite}
.sa-blink{animation:sa-glow 2.2s ease-in-out infinite}
@keyframes sa-spin{to{transform:rotate(360deg)}}
@keyframes sa-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes sa-swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes sa-spark{0%{opacity:1}100%{opacity:.15}}
@keyframes sa-glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sa-dash{to{stroke-dashoffset:-18}}
@keyframes sa-paint{from{transform:scaleX(1)}to{transform:scaleX(2.2)}}
@keyframes sa-roll{from{transform:translateX(0)}to{transform:translateX(48px)}}
@keyframes sa-drill{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(9px)}}
@keyframes sa-dip{0%,15%{transform:translateY(0)}50%,65%{transform:translateY(16px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.sa-spin,.sa-bob,.sa-swing,.sa-spark,.sa-spark2,.sa-glow,.sa-dash,.sa-paint,.sa-roll,.sa-drill,.sa-dip,.sa-blink{animation:none}}
</style><g><g><rect x="0" y="100" width="160" height="20" fill="#78716c" opacity="0.25"></rect><line x1="0" y1="100" x2="160" y2="100" stroke="#78716c" stroke-width="1.5" opacity="0.6"></line></g><rect x="22" y="94" width="28" height="6" fill="#a8a29e"></rect><rect x="110" y="94" width="28" height="6" fill="#a8a29e"></rect><rect x="27" y="91" width="18" height="3" fill="#1e293b"></rect><rect x="115" y="91" width="18" height="3" fill="#1e293b"></rect><g><rect x="30" y="30" width="12" height="61" fill="#475569"></rect><rect x="30" y="30" width="2.5" height="61" fill="#1e293b" opacity="0.55"></rect><rect x="39.5" y="30" width="2.5" height="61" fill="#1e293b" opacity="0.55"></rect><rect x="35" y="30" width="2" height="61" fill="#fff" opacity="0.18"></rect></g><g><rect x="118" y="30" width="12" height="61" fill="#475569"></rect><rect x="118" y="30" width="2.5" height="61" fill="#1e293b" opacity="0.55"></rect><rect x="127.5" y="30" width="2.5" height="61" fill="#1e293b" opacity="0.55"></rect><rect x="123" y="30" width="2" height="61" fill="#fff" opacity="0.18"></rect></g><rect x="66" y="94" width="28" height="6" fill="#a8a29e"></rect><rect x="71" y="91" width="18" height="3" fill="#1e293b" opacity="0.6"></rect><g><line x1="80" y1="0" x2="80" y2="16" stroke="#1e293b" stroke-width="1.2"></line><g><rect x="76" y="12" width="8" height="6" rx="1.5" fill="#f97316"></rect><path d="M80 18 v4 a3 3 0 1 1 -3 3" fill="none" stroke="#1e293b" stroke-width="1.6" stroke-linecap="round"></path></g><line x1="80" y1="26" x2="74" y2="34" stroke="#1e293b" stroke-width="1"></line><line x1="80" y1="26" x2="86" y2="34" stroke="#1e293b" stroke-width="1"></line><g><rect x="74" y="33" width="12" height="50" fill="#f97316"></rect><rect x="74" y="33" width="2.5" height="50" fill="#1e293b" opacity="0.55"></rect><rect x="83.5" y="33" width="2.5" height="50" fill="#1e293b" opacity="0.55"></rect><rect x="79" y="33" width="2" height="50" fill="#fff" opacity="0.18"></rect></g></g></g></svg>